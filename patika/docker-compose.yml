name: patika

x-app: &app
  env_file: .env
  environment: &app-env
    ConnectionStrings__Patika: "Host=postgres;Port=5432;Database=patika;Username=patika;Password=${POSTGRES_PASSWORD:-patika-local-db}"
    Storage__Endpoint: http://minio:9000
    Storage__Bucket: ${Storage__Bucket:-patika-local}
    Storage__AccessKey: ${Storage__AccessKey:-patika-local}
    Storage__SecretKey: ${Storage__SecretKey:-patika-local-storage}
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

x-billing: &billing
  # Local simulation only (ADR-0010): the fake Play store, allowed explicitly, and the Data Protection key
  # ring the API encrypts purchase tokens with. Only the API and the Worker mount it; Web keeps its own.
  Billing__Provider: Fake
  Billing__AllowFake: "true"
  DataProtection__KeysPath: /keys

services:
  billing-keys-init:
    image: mcr.microsoft.com/dotnet/runtime:10.0
    user: root
    volumes:
      - billing-keys:/keys
    entrypoint: [sh, -c, 'chown 1654:1654 /keys && chmod 770 /keys']
    restart: "no"
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: patika
      POSTGRES_USER: patika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patika-local-db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${Storage__AccessKey:-patika-local}
      MINIO_ROOT_PASSWORD: ${Storage__SecretKey:-patika-local-storage}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_ACCESS_KEY: ${Storage__AccessKey:-patika-local}
      STORAGE_SECRET_KEY: ${Storage__SecretKey:-patika-local-storage}
      STORAGE_BUCKET: ${Storage__Bucket:-patika-local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"

  api:
    <<: *app
    build:
      context: .
      dockerfile: src/Patika.Api/Dockerfile
    depends_on:
      billing-keys-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - billing-keys:/keys
    environment:
      <<: [*app-env, *billing]
      ASPNETCORE_HTTP_PORTS: "8080"
      # Host the app loads photos and PUTs uploads from; URLs are signed for this host. 10.0.2.2 is the
      # Android emulator's alias for this machine (the Debug app allows cleartext only there).
      Storage__PublicEndpoint: ${Storage__PublicEndpoint:-http://10.0.2.2:9000}
      # Local stack only: apply EF migrations on startup. Production runs them as a separate step.
      Database__MigrateOnStartup: "true"
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\r\n\r\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    ports:
      - "127.0.0.1:5000:8080"

  web:
    <<: *app
    build:
      context: .
      dockerfile: src/Patika.Web/Dockerfile
    environment:
      <<: *app-env
      ASPNETCORE_HTTP_PORTS: "8080"
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:5001:8080"

  worker:
    <<: *app
    depends_on:
      billing-keys-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - billing-keys:/keys
    environment:
      <<: [*app-env, *billing]
    build:
      context: .
      dockerfile: src/Patika.Worker/Dockerfile

volumes:
  billing-keys:
  postgres-data:
  minio-data:

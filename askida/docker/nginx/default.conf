# nginx in front of PHP-FPM (same container). JSON bodies are capped at 1 MB;
# only the shop document endpoints accept up to 6 MB (security checklist item 6).
# /robots.txt is served by Laravel (no static file), like every other public route.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    client_max_body_size 1m;

    location ~ ^/api/v1/shops/[^/]+/documents(/|$) {
        client_max_body_size 6m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # Before the static rule below: regex locations match in order.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Public web static files are versioned (`?v=<sha1>`) or never change in place, so they
    # are cached for a year. A path with no file on disk (for example the per-shop Open Graph
    # image /og/dukkan/<slug>.png) falls through to Laravel, which sets its own headers.
    location ~* \.(css|woff2|svg|png)$ {
        try_files $uri /index.php?$query_string;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css text/plain text/xml text/csv application/json application/ld+json application/xml image/svg+xml;

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }
}

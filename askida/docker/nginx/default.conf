# nginx in front of PHP-FPM (same container). JSON bodies are capped at 1 MB;
# only the shop document endpoints accept up to 6 MB (security checklist item 6).
# /robots.txt is served by Laravel (no static file), like every other public route.

# Access log without personal data: no client address, no query string (the nearby-shops
# request carries the approximate position as `near=`), no referrer, no browser headers. The
# path is the one the client sent ($request_uri up to `?`; $uri would already read
# /index.php after the rewrite), and the payment page token in /pay/<token> is replaced by
# a fixed marker. Error log lines are written by nginx itself and are not covered by this
# format (see docs/security/zap-report.md).
map $request_uri $askida_log_path {
    ~^/pay/                    /pay/-;
    ~^(?<askida_path>[^?]*)    $askida_path;
}

log_format askida_private '$time_iso8601 "$request_method $askida_log_path $server_protocol" '
                          '$status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/access.log askida_private;

    client_max_body_size 1m;

    location ~ ^/api/v1/shops/[^/]+/documents(/|$) {
        client_max_body_size 6m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }

    # Files only, no directory step: a directory such as /og/ has no index, so `$uri/` made
    # nginx answer 403 itself, without the security headers Laravel adds (ZAP 10038, 10063).
    # Every path that is not a file now reaches Laravel.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # Before the static rule below: regex locations match in order.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Public web static files are versioned (`?v=<sha1>`) or never change in place, so they
    # are cached for a year. A path with no file on disk (for example the per-shop Open Graph
    # image /og/dukkan/<slug>.png) falls through to Laravel, which sets its own headers.
    location ~* \.(css|woff2|svg|png)$ {
        try_files $uri /index.php?$query_string;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Same value as config/secure-headers.php: static files are not served through
        # Laravel, so the header is set here (ZAP 90004).
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        access_log off;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css text/plain text/xml text/csv application/json application/ld+json application/xml image/svg+xml;

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }
}

; Askida local PHP settings. Upload limits sit just above the nginx limits so that
; nginx rejects oversized bodies first.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 6M
post_max_size = 7M
max_execution_time = 60
date.timezone = UTC
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

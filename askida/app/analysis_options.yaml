include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/gen/**
    # Built by build_runner (tool/codegen.sh), never committed.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/*.mocks.dart"
  errors:
    # freezed puts json_serializable annotations on factory parameters.
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false

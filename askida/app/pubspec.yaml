name: askida
description: "Askıda mobile app: donors, merchants and anonymous recipients in one Flutter app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  app_links: ^7.2.1
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  sign_in_with_apple: ^8.2.0
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  # Static Bricolage Grotesque instances, byte-identical copies of
  # ../brand/fonts/bricolage-grotesque (checked by test/design/brand_sync_test.dart).
  fonts:
    - family: BricolageText
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Text-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-Text-SemiBold.ttf
          weight: 600
    - family: BricolageDisplay
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Display-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Display-Bold.ttf
          weight: 700

name: askida
description: "Askıda mobile app: donors, merchants and anonymous recipients in one Flutter app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  # Static Bricolage Grotesque instances, byte-identical copies of
  # ../brand/fonts/bricolage-grotesque (checked by test/design/brand_sync_test.dart).
  fonts:
    - family: BricolageText
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Text-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-Text-SemiBold.ttf
          weight: 600
    - family: BricolageDisplay
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Display-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Display-Bold.ttf
          weight: 700

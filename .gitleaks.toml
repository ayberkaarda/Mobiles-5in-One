# Extends the default gitleaks rules. The first allowlist entry covers a unit test
# that builds throwaway keys at run time and passes them under the real variable names;
# the second skips generated build output and installed dependencies.
[extend]
useDefault = true

[[allowlists]]
description = "Throwaway keys generated inside the environment schema tests"
condition = "AND"
paths = ['''kadro/packages/config/src/env\.test\.ts''']
targetRules = ['generic-api-key']

[[allowlists]]
description = "Fixed dummy email-link tokens in the mobile auth tests"
condition = "AND"
paths = ['''kadro/apps/mobile/tests/auth-(units|api|screens)\.test\.tsx?''']
targetRules = ['generic-api-key']

[[allowlists]]
description = "Fixed dummy Apple identity tokens in the mobile profile tests"
condition = "AND"
paths = ['''kadro/apps/mobile/tests/profile-(units|screens)\.test\.tsx?''']
targetRules = ['generic-api-key', 'jwt']

[[allowlists]]
description = "Plain district slug pair in the mobile deep link tests"
condition = "AND"
paths = ['''kadro/apps/mobile/tests/links-units\.test\.tsx?''']
targetRules = ['generic-api-key']

[[allowlists]]
description = "Generated build output (Next.js preview and server-action keys) and installed dependencies"
paths = ['''(^|/)\.next/''', '''(^|/)node_modules/''']

[[allowlists]]
description = "Runtime-built dummy password in the cetele sms configuration test"
condition = "AND"
paths = ['''cetele/server/src/test/kotlin/app/cetele/server/reminders/sms/SmsConfigurationTest\.kt''']
targetRules = ['generic-api-key']

[[allowlists]]
description = "Phase 4 cetele server tests: RSA keys generated at run time, the RFC 6238 appendix B seed and fixed local dummy secrets"
condition = "AND"
paths = [
  '''cetele/server/src/test/kotlin/app/cetele/server/admin/AdminCryptoTest\.kt''',
  '''cetele/server/src/test/kotlin/app/cetele/server/billing/BillingConfigurationTest\.kt''',
  '''cetele/server/src/test/kotlin/app/cetele/server/billing/play/HttpPlayDeveloperApiTest\.kt''',
  '''cetele/server/src/test/kotlin/app/cetele/server/auth/integrity/HttpPlayIntegrityApiTest\.kt''',
  '''cetele/server/src/test/kotlin/app/cetele/server/reminders/delivery/SmsDlrWebhookTest\.kt''',
]
targetRules = ['generic-api-key', 'private-key']

[[allowlists]]
description = "Fixed dummy passwords and magic-link tokens in the inecekvar sign-in unit tests"
condition = "AND"
paths = [
  '''inecekvar/apps/mobile/src/app/pages/auth-pages\.spec\.ts''',
  '''inecekvar/libs/data-access/src/lib/session\.store\.spec\.ts''',
]
targetRules = ['generic-api-key']

[[allowlists]]
description = "The public example signing secret from the Svix documentation, present in one early commit of the phase 5 webhook test and since replaced by values built from parts"
condition = "AND"
commits = ['8197119dd6cb4c5f82abbdb4ebd500cb953aac58']
paths = [
  '''inecekvar/api/tests/webhooks/test_resend_webhook\.py''',
]
targetRules = ['generic-api-key']

[[allowlists]]
description = "A dummy password literal in the phase 6 dump and log scan test, present in one early commit and since replaced by a value built from parts"
condition = "AND"
commits = ['17ea86d5ed051158c5ae74ed5d7dde69d5c1fe1e']
paths = [
  '''inecekvar/api/tests/security/test_dump_and_log_scan\.py''',
]
targetRules = ['generic-api-key']

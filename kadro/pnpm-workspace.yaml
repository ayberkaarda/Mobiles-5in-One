# Documented audit exceptions, see docs/adr/0043-node-forge-advisory-exception.md and
# docs/adr/0078-braces-advisory-exception.md.
# Only these advisories are ignored; the CI gate (`--audit-level=high`) is unchanged.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm

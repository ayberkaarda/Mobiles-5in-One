# Starts the app with no stored session and signs in with EMAIL / PASSWORD.
# Ends on the tabs (matches tab) with the push permission card dismissed.
appId: app.kadro.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: welcome-sign-in
    timeout: 60000
- tapOn:
    id: welcome-sign-in
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 10000
- tapOn:
    id: sign-in-email
- inputText: ${EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: tab-matches
    timeout: 30000
- runFlow: dismiss-push-prompt.yaml

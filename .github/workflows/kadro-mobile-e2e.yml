name: Kadro mobile e2e

# Maestro flows of the Kadro app (kadro/apps/mobile/.maestro) on an Android emulator against a
# local stack started from kadro/docker-compose.yml. Manual dispatch only: it is a second proof
# next to a run on a developer machine, not a required check. Android only; iOS is out of scope.
# Actions are pinned to full commit SHAs; the Maestro release archive is checked against its
# SHA-256. See kadro/docs/adr/0076-mobile-maestro-e2e.md and kadro/apps/mobile/e2e/README.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kadro-mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: kadro

env:
  MAESTRO_VERSION: 2.9.0
  MAESTRO_SHA256: 855bb2ce1399d82f4f4a73d84a4d945f70b0d43eb86127e027af82809f63f0bd
  EXPO_PUBLIC_APP_ENV: local
  EXPO_PUBLIC_API_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  android:
    name: Maestro on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version is read from the "packageManager" field in kadro/package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: kadro/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: kadro/.nvmrc

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        working-directory: .
        run: |
          archive="$RUNNER_TEMP/maestro.zip"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm turbo run build --filter=@kadro/db... --filter=@kadro/config

      # Local-only configuration: .env.example plus secrets created for this run (never
      # printed, never uploaded).
      - name: Prepare .env
        run: |
          grep -v -E '^(JWT_PRIVATE_KEY|JWT_PUBLIC_KEY|CSRF_SECRET|HASH_SECRET|REVENUECAT_WEBHOOK_SECRET|TOTP_ENCRYPTION_KEY)=' \
            .env.example > .env
          pnpm --silent --filter @kadro/config secrets:generate >> .env

      - name: Start database, migrate and seed reference data
        run: |
          docker compose up -d --wait postgres
          docker compose up db-roles
          pnpm --filter @kadro/db db:migrate
          pnpm --filter @kadro/db db:seed

      - name: Start web and worker
        run: >-
          docker compose -f docker-compose.yml -f apps/mobile/e2e/compose.e2e.yml
          up -d --build --wait web worker

      - name: Seed flow data
        working-directory: kadro/apps/mobile
        run: node e2e/seed.mjs

      - name: Build the Android debug app
        working-directory: kadro/apps/mobile
        run: |
          pnpm exec expo prebuild --platform android --no-install
          ./android/gradlew -p android :app:assembleDebug

      # The debug build loads JavaScript from Metro on port 8081.
      - name: Start Metro
        working-directory: kadro/apps/mobile
        env:
          CI: "1"
        run: |
          nohup pnpm exec expo start --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8081/status > /dev/null; then
              echo "Metro is up"
              exit 0
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/metro.log"
          exit 1

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: kadro/apps/mobile
          script: |
            adb reverse tcp:3000 tcp:3000
            adb reverse tcp:8081 tcp:8081
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            node e2e/run-flows.mjs

      - name: Collect logs
        if: always()
        run: |
          mkdir -p apps/mobile/e2e/output
          docker compose logs --no-color web worker > apps/mobile/e2e/output/stack.log 2>&1 || true
          cp "$RUNNER_TEMP/metro.log" apps/mobile/e2e/output/metro.log 2>/dev/null || true

      # Reports, screenshots and logs only; .env and e2e/.env.e2e are not part of the upload.
      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kadro-maestro-android
          path: kadro/apps/mobile/e2e/output
          if-no-files-found: ignore
          retention-days: 7

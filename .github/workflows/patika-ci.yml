name: Patika CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: patika-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  changes:
    name: Detect Patika changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      patika: ${{ steps.diff.outputs.patika }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diff against base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          base=""
          head=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="HEAD^1"
            head="HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
            head="$AFTER"
          fi
          if [ -z "$base" ]; then
            patika=true
          else
            if git diff --quiet --no-renames "$base" "$head" -- patika/ .github/workflows/patika-ci.yml .github/dependabot.yml .gitleaks.toml; then
              status=0
            else
              status=$?
            fi
            case "$status" in
              0) patika=false ;;
              *) patika=true ;;
            esac
          fi
          echo "patika=$patika" >> "$GITHUB_OUTPUT"

  backend:
    name: Patika backend
    needs: changes
    if: needs.changes.outputs.patika == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: patika
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Pinned: the 10.0.403 SDK picked by latestPatch cannot be downloaded by setup-dotnet; global.json still accepts 10.0.402.
          dotnet-version: 10.0.402
      - name: Restore backend and tests
        run: |
          for project in src/*/*.csproj tests/*/*.csproj; do
            dotnet restore "$project"
          done
      - name: Build backend and tests
        run: |
          for project in src/*/*.csproj tests/*/*.csproj; do
            dotnet build "$project" -c Release --no-restore
          done
      - name: Reject unfinished code markers
        run: |
          if git grep -n -I -E 'TODO|FIXME|lorem|YOUR_' -- src app; then
            echo 'Unfinished code markers found.'
            exit 1
          else
            status=$?
            [ "$status" = 1 ] || exit "$status"
          fi
      - name: Test
        run: |
          for project in tests/*/*.csproj; do
            dotnet test "$project" -c Release --no-build --no-restore
          done
      - name: Verify formatting
        run: |
          for project in src/*/*.csproj tests/*/*.csproj; do
            dotnet format "$project" --verify-no-changes --no-restore
          done

  android:
    name: Patika Android
    needs: changes
    if: needs.changes.outputs.patika == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Pinned: the 10.0.403 SDK picked by latestPatch cannot be downloaded by setup-dotnet; global.json still accepts 10.0.402.
          dotnet-version: 10.0.402
      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install MAUI Android workload
        working-directory: patika
        run: dotnet workload install maui-android
      - name: Check vulnerable packages
        working-directory: patika
        shell: bash
        run: |
          # The parser must reject empty, truncated and failed reports before it is trusted with the real one.
          bash ops/ci/test-vulnerable-packages.sh
          dotnet restore Patika.slnx
          dotnet list Patika.slnx package --vulnerable --include-transitive --format json --output-version 1 > "$RUNNER_TEMP/patika-vulnerabilities.json"
          expected="$(dotnet sln Patika.slnx list | grep -c '\.csproj$')"
          python3 ops/ci/check-vulnerable-packages.py "$RUNNER_TEMP/patika-vulnerabilities.json" "$expected"
      - name: Create CycloneDX inventory
        working-directory: patika
        run: |
          dotnet tool install CycloneDX --version 6.3.1 --tool-path "$RUNNER_TEMP/patika-tools"
          "$RUNNER_TEMP/patika-tools/dotnet-CycloneDX" Patika.slnx -o "$RUNNER_TEMP/patika-sbom" --output-format Json
      - name: Upload package inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patika-sbom
          path: ${{ runner.temp }}/patika-sbom/*.json
          if-no-files-found: error
      - name: Verify Android formatting
        run: dotnet format patika/app/Patika.App/Patika.App.csproj --verify-no-changes
      - name: Build Android
        working-directory: patika
        run: dotnet build app/Patika.App/Patika.App.csproj -f net10.0-android -c Release
      - name: Check merged Android release manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifests = list(Path('patika/app/Patika.App/obj/Release/net10.0-android').glob('**/android/AndroidManifest.xml'))
          if not manifests: raise SystemExit('Release manifest missing')
          android = '{http://schemas.android.com/apk/res/android}'
          for manifest in manifests:
              app = ET.parse(manifest).getroot().find('application')
              assert app is not None
              assert app.get(android + 'allowBackup') == 'false'
              assert app.get(android + 'dataExtractionRules') is not None
              assert app.get(android + 'fullBackupContent') is not None
              assert app.get(android + 'usesCleartextTraffic') == 'false'
              assert app.get(android + 'debuggable', 'false') == 'false'
              for component in app:
                  if component.tag in ('activity', 'activity-alias', 'service', 'receiver', 'provider'):
                      assert component.get(android + 'exported') in ('true', 'false'), component.get(android + 'name')
          PY

  compose:
    name: Patika Compose validation
    needs: changes
    if: needs.changes.outputs.patika == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: |
          cp patika/.env.example patika/.env
          docker compose -f patika/docker-compose.yml config --quiet

  zap:
    name: Patika ZAP baseline
    needs: changes
    if: needs.changes.outputs.patika == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: patika
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ZAP baseline on the Web and the admin sign-in
        env:
          ZAP_OUT: ${{ runner.temp }}/patika-zap
        run: bash ops/ci/zap/zap-baseline.sh
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patika-zap
          path: ${{ runner.temp }}/patika-zap/zap-*
          if-no-files-found: warn

  gitleaks:
    name: Patika secret scan
    needs: changes
    if: needs.changes.outputs.patika == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (all commits)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml --log-opts="--all" .'

  gate:
    name: Patika CI gate
    needs: [changes, backend, android, compose, zap, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PATIKA_CHANGED: ${{ needs.changes.outputs.patika }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          ZAP_RESULT: ${{ needs.zap.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          [ "$CHANGES_RESULT" = "success" ] || exit 1
          case "$PATIKA_CHANGED" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          for result in "$BACKEND_RESULT" "$ANDROID_RESULT" "$COMPOSE_RESULT" "$ZAP_RESULT" "$GITLEAKS_RESULT"; do
            if [ "$result" != "$expected" ]; then
              echo "Patika CI failed: patika=$PATIKA_CHANGED requires every job to be $expected."
              exit 1
            fi
          done
          echo "Patika CI passed (patika=$PATIKA_CHANGED, all jobs $expected)."

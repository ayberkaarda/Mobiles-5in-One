<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Parola')}"></head>
<body>
<header th:replace="~{admin/fragments :: nav}"></header>
<main id="main" class="narrow">
  <h1 th:text="${forced} ? 'Yeni parola belirleyin' : 'Parolamı değiştir'">Parola</h1>
  <p class="muted" th:if="${forced}">İlk girişte veya parola sıfırlandıktan sonra kendi parolanızı belirlemeniz gerekir.</p>
  <p class="muted">Parola 12 ile 128 karakter arasında olmalı.</p>
  <p th:replace="~{admin/fragments :: notice}"></p>
  <p th:replace="~{admin/fragments :: error}"></p>
  <form th:action="@{/admin/account/password}" method="post" class="stack">
    <th:block th:unless="${forced}">
      <label for="currentPassword">Mevcut parola</label>
      <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required maxlength="128">
    </th:block>
    <label for="newPassword">Yeni parola</label>
    <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
    <label for="confirmPassword">Yeni parola (tekrar)</label>
    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
    <button type="submit">Parolayı kaydet</button>
  </form>
</main>
</body>
</html>

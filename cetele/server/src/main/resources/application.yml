# Every deployment-specific value comes from the environment (see cetele/.env.example).
# There is no production profile file in the repository.
spring:
  application:
    name: cetele-server
  datasource:
    url: ${CETELE_DB_URL}
    username: ${CETELE_DB_USERNAME}
    password: ${CETELE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    # Errors are rendered by web.problem.ProblemHandler with the cetele code registry.
    problemdetails:
      enabled: false
  servlet:
    # No multipart anywhere: photos go to object storage through presigned URLs.
    multipart:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  thymeleaf:
    check-template-location: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # X-Forwarded-For/-Proto are honoured only from CETELE_TRUSTED_PROXIES (empty = nobody).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${CETELE_TRUSTED_PROXIES:}
      trusted-proxies: ${CETELE_TRUSTED_PROXIES:}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # No liveness/readiness groups: the response stays exactly {"status":"UP"}.
      probes:
        enabled: false

logging:
  structured:
    # Used outside the local profile (logback-spring.xml); string values are masked.
    format:
      console: ecs
    json:
      customizer: app.cetele.server.config.logging.MaskingJsonMembersCustomizer

springdoc:
  api-docs:
    enabled: false
  paths-to-match: /v1/**

cetele:
  security:
    require-https: true
  jwt:
    private-key-pem: ${CETELE_JWT_ES256_PRIVATE_KEY_PEM:}
    public-key-pem: ${CETELE_JWT_ES256_PUBLIC_KEY_PEM:}
    issuer: https://cetele.app
    access-token-ttl: 15m
    clock-skew: 30s
  client-ip:
    trusted-proxies: ${CETELE_TRUSTED_PROXIES:}
  s3:
    endpoint: ${CETELE_S3_ENDPOINT:}
    region: ${CETELE_S3_REGION:auto}
    access-key: ${CETELE_S3_ACCESS_KEY:}
    secret-key: ${CETELE_S3_SECRET_KEY:}
    bucket-media: ${CETELE_S3_BUCKET_MEDIA:cetele-media}
    path-style: ${CETELE_S3_PATH_STYLE:true}

---
# Developer machines and the test suite: plain HTTP, OpenAPI document served.
spring:
  config:
    activate:
      on-profile: local | test
cetele:
  security:
    require-https: false
springdoc:
  api-docs:
    enabled: true

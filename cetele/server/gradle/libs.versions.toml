# Server version catalog. Library versions without a `version` come from the Spring Boot BOM.
[versions]
kotlin = "2.4.20"
spring-boot = "4.1.1"
jib = "3.5.4"
ktlint-gradle = "14.2.0"
ktlint-cli = "1.8.0"
nimbus-jose-jwt = "10.10"
bucket4j = "8.21.0"
springdoc = "3.1.1"
archunit = "1.5.1"
aws-sdk = "2.55.11"
tika = "4.1.0"
thumbnailator = "0.4.21"
twelvemonkeys = "3.15.2"
pdfbox = "3.0.8"
totp = "1.7.1"
bouncycastle = "1.86"
commonmark = "0.30.1"
# Security patch levels above the Spring Boot BOM (dependency scan, scan-reports/dependency-scan.md):
# Tomcat 11.0.24 of Boot 4.1.1 is affected by CVE-2026-65637 and eight more fixed in 11.0.25, Netty
# 4.2.17 by CVE-2026-89044 fixed in 4.2.18. Remove when the Boot BOM reaches these versions.
tomcat = "11.0.26"
netty = "4.2.19.Final"

# Scanning and reporting plugins (spec items 19 and 23); resolved on the Gradle Plugin Portal 2026-10-11.
dependency-check = "13.0.0"
versions-report = "0.65.0"
cyclonedx = "3.5.1"

[libraries]
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
bucket4j-caffeine = { module = "com.bucket4j:bucket4j_jdk17-caffeine", version.ref = "bucket4j" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
springdoc-openapi-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-s3 = { module = "software.amazon.awssdk:s3" }
aws-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
thumbnailator = { module = "net.coobird:thumbnailator", version.ref = "thumbnailator" }
imageio-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "twelvemonkeys" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
totp = { module = "dev.samstevens.totp:totp", version.ref = "totp" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }

spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-minio = { module = "org.testcontainers:testcontainers-minio" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependency-check" }
versions-report = { id = "io.github.ben-manes.versions", version.ref = "versions-report" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }

# Overrides on top of the detekt default configuration (buildUponDefaultConfig = true).
config:
  validation: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes:
      - '**/test/**'
  UnusedPrivateMember:
    ignoreAnnotated:
      - Preview

complexity:
  LongParameterList:
    ignoreAnnotated:
      - Composable

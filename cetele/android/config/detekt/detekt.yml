# Overrides on top of the detekt default configuration (buildUponDefaultConfig = true).
config:
  validation: true
  excludes: 'cetele>.*'

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes:
      - '**/test/**'
  UnusedPrivateMember:
    ignoreAnnotated:
      - Preview

complexity:
  # Test fixtures spell out full wire bodies and scenarios; length limits apply to production code.
  LongMethod:
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
  LargeClass:
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
  LongParameterList:
    ignoreDataClasses: true
    ignoreAnnotated:
      - Composable

cetele:
  MonetaryDouble:
    active: true

[project]
name = "inecekvar-api"
version = "0.1.0"
description = "Inecek Var HTTP API (FastAPI, PostgreSQL with PostGIS, Redis)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Application, not a distributable package: `uv sync` installs the dependencies only.
package = false

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
    "types-docker>=7.2.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "ASYNC", "PT", "RUF", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest expresses checks.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "postgis: needs a PostgreSQL + PostGIS database (INECEKVAR_TEST_DATABASE_URL or Docker for Testcontainers)",
]

[project]
name = "inecekvar-api"
version = "0.1.0"
description = "Inecek Var HTTP API (FastAPI, PostgreSQL with PostGIS, Redis)."
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.25.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.111",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "shapely>=2.2.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Application, not a distributable package: `uv sync` installs the dependencies only.
package = false

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "boto3-stubs[s3]>=1.43.111",
    "fakeredis[lua]>=2.39.0",
    "httpx>=0.28.1",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "testcontainers[minio,postgres,redis]>=4.15.0",
    "types-docker>=7.2.0.20261006",
    "types-networkx>=3.6.1.20261006",
    "types-shapely>=2.1.0.20260728",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "ASYNC", "PT", "RUF", "SIM", "N"]
# Turkish product copy uses the dotless i.
allowed-confusables = ["ı"]

[tool.ruff.lint.isort]
# api/alembic is the migration directory; the import name means the Alembic library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest expresses checks; fixture passwords and token strings are test data.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "postgis: needs a PostgreSQL + PostGIS database (INECEKVAR_TEST_DATABASE_URL or Docker for Testcontainers)",
]

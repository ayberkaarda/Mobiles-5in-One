rules:
  - id: iv-python-secret-compare
    languages: [python]
    severity: WARNING
    message: >-
      A secret, token, digest or signature is compared with == or !=, which leaks timing.
      Compare with hmac.compare_digest (heuristic: matched on the operand names).
    metadata:
      cwe: "CWE-208: Observable timing discrepancy"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either: &comparisons
                  - pattern: $LEFT == $RIGHT
                  - pattern: $LEFT != $RIGHT
              - metavariable-regex:
                  metavariable: $LEFT
                  regex: "(?i).*(signature|digest|hmac|secret|token|csrf|api_key|(^|[^a-z])mac([^a-z]|$)).*"
          - patterns:
              - pattern-either: *comparisons
              - metavariable-regex:
                  metavariable: $RIGHT
                  regex: "(?i).*(signature|digest|hmac|secret|token|csrf|api_key|(^|[^a-z])mac([^a-z]|$)).*"
      # Presence, length, constant and type-tag checks carry no secret material.
      - pattern-not: $LEFT == None
      - pattern-not: $LEFT != None
      - pattern-not: $LEFT == "..."
      - pattern-not: $LEFT != "..."
      - pattern-not: '"..." == $RIGHT'
      - pattern-not: '"..." != $RIGHT'
      - pattern-not: len(...) == $RIGHT
      - pattern-not: len(...) != $RIGHT
      - pattern-not: $LEFT == len(...)
      - pattern-not: $LEFT != len(...)
      - pattern-not: $LEFT == $X.$CONST
      - pattern-not: $LEFT != $X.$CONST
      - pattern-not: $LEFT == 0
      - pattern-not: $LEFT != 0
      # SQLAlchemy column comparisons build a WHERE clause with a bound parameter (the lookup
      # by the SHA-256 of a random token); the database compares, not Python.
      - pattern-not-inside: $QUERY.where(...)
      - pattern-not-inside: $QUERY.filter(...)
      - pattern-not-inside: sqlalchemy.and_(...)
      - pattern-not-inside: sqlalchemy.or_(...)
